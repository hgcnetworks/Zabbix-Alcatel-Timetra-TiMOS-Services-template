              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.6527.3.1.2.4.4.5.1.4.{#SNMPINDEX}]'
              key: 'sdpBind.outForwardedOctets[{#SNMPINDEX}]'
